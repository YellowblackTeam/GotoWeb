<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GotoWeb</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:white;
    color:#222;
}

.container{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.logo{
    width:320px;
    image-rendering:auto;
    margin-bottom:20px;
}

.search-box{
    width:580px;
    max-width:90%;
}

.search-input{
    width:100%;
    height:34px;
    border:1px solid #c6c6c6;
    padding:0 10px;
    font-size:16px;
    outline:none;
    box-sizing:border-box;
}

.search-input:focus{
    border:1px solid #4d90fe;
}

.buttons{
    margin-top:18px;
}

button{
    height:32px;
    padding:0 14px;
    margin:0 4px;
    border:1px solid #dcdcdc;
    background:#f5f5f5;
    color:#444;
    font-size:13px;
    cursor:pointer;
}

button:hover{
    border:1px solid #b8b8b8;
}

.footer{
    position:fixed;
    bottom:10px;
    width:100%;
    text-align:center;
    color:#777;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

    <!-- LOGO -->
    <img src="logo.png" class="logo">

    <!-- PESQUISA -->
    <div class="search-box">
        <input 
            type="text" 
            class="search-input" 
            placeholder="Pesquisar na GotoWeb..."
            id="search"
        >

        <div class="buttons">
            <button onclick="searchWeb()">Pesquisa GotoWeb</button>
            <button onclick="lucky()">Estou com Sorte</button>
        </div>
    </div>

</div>

<div class="footer">
    © 2026 GotoWeb
</div>

<script>
function searchWeb(){
    const query = document.getElementById("search").value;

    if(query.trim() !== ""){
        alert("Pesquisar por: " + query);

        // Futuro:
        // window.location.href = "search.html?q=" + encodeURIComponent(query);
    }
}

function lucky(){
    alert("Função 'Estou com Sorte' ainda não pronta!");
}

document.getElementById("search").addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        searchWeb();
    }
});
</script>

</body>
</html>
